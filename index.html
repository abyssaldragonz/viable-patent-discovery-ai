<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PatentSpark</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta/dist/vanta.net.min.js"></script>
  </head>
  <body>
    <div>
      <div id="hi" style="position: fixed; z-index: -100; width: 100vw; height: 100vh"></div>
      <script>
      VANTA.NET({
        el: "#hi",
        mouseControls: true,
        touchControls: true,
        gyroControls: false,
        scale: 1.00,
        scaleMobile: 1.00,
        color: 0x48cc31,
        backgroundColor: 0x01172f,
        points: 15.00,
        maxDistance: 30.00,
        spacing: 18.00
      })
      </script>
      <div id="root"></div>
      <script type="module" src="/src/main.jsx"></script>
    </div>
  </body>
</html>
